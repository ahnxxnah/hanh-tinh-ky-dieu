.solar-explorer{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:18px;margin-top:20px}
.solar-stage{position:relative;aspect-ratio:1 / 1;max-height:590px;width:100%;max-width:590px;margin:auto;background:radial-gradient(circle at 50% 50%,#1f4771 0%,#0a2243 53%,#051127 93%);border-radius:24px;overflow:hidden;isolation:isolate}

.orbital.orbit-active{border-color:#b4deff65}

.planet-sphere.p7{background:radial-gradient(circle at 30% 24%,#86b4f8,#2977d0 52%,#0d266b)}
.planet-ring{position:absolute;width:185%;height:48%;border:clamp(3px,.8vw,7px) solid #c9b798a8;border-left-color:#a78d73a8;border-radius:50%;transform:rotate(-23deg);z-index:2;pointer-events:none;box-shadow:0 0 3px #e6d6b5}

const mediaCache=new Map();
function safeLink(u){try{let a=new URL(u);return a.protocol==='https:'&&(/\.wikimedia\.org$|\.wikipedia\.org$/.test(a.hostname))?a.href:''}catch(e){return ''}}
function stripTags(t){const el=document.createElement('div');el.innerHTML=String(t||'');return (el.textContent||'').trim().slice(0,110)}
async function commonsQuery(term,video=false){const key=(video?'video:':'photo:')+term;if(mediaCache.has(key))return mediaCache.get(key);
 const task=(async()=>{const params=new URLSearchParams({action:'query',generator:'search',gsrnamespace:'6',gsrlimit:video?'12':'12',gsrsearch:(video?'filetype:video ':'filetype:bitmap ')+term,prop:'imageinfo',iiprop:'url|mime|size|extmetadata',iiurlwidth:'780',format:'json',origin:'*'});
 const res=await fetch('https://commons.wikimedia.org/w/api.php?'+params.toString(),{mode:'cors'});if(!res.ok)throw Error('cannot load');const o=await res.json();const arr=Object.values(o.query?.pages||{}).sort((a,b)=>a.index-b.index);
 return arr.filter(x=>{let i=x.imageinfo?.[0];if(!i)return false;return (i.mime==='image/jpeg'||i.mime==='image/png')&&/(public domain|cc0|pd[- _]|no known copyright)/i.test(stripTags(i.extmetadata?.LicenseShortName?.value||'')+' '+stripTags(i.extmetadata?.License?.value||''))}).map(x=>{let i=x.imageinfo[0],m=i.extmetadata||{};return {src:safeLink(i.thumburl||i.url),original:safeLink(i.url),file:safeLink(i.descriptionurl)||'https://commons.wikimedia.org/wiki/'+encodeURIComponent(x.title).replace(/%3A/,'%3A'),title:x.title,license:stripTags(m.LicenseShortName?.value)||'Xem nguồn',artist:stripTags(m.Artist?.value)||'Người đóng góp Wikimedia Commons',size:i.size||0}}).filter(x=>x.src);
 })();mediaCache.set(key,task);return task;
}
function mediaCard(label,term,fallback){return `<div class="photo-card"><div class="photo-box" data-photo-query="${esc(term)}"><span class="photo-fallback">${fallback}</span></div><div class="photo-credit"><b>${esc(label)}</b><div class="media-status">Ảnh thật: cần kết nối mạng</div></div></div>`}
function mediaCredit(item,label){return `<b>${esc(label)}</b><span class="pd-credit">Nguồn: Wikimedia Commons · ${esc(item.license)} · Tác giả: ${esc(item.artist)}. Không có nút mở ảnh.</span>`}
function hydrateMedia(root=document){root.querySelectorAll('[data-photo-query]:not([data-requested])').forEach(async box=>{
 box.dataset.requested='1';const term=box.dataset.photoQuery;const cred=box.closest('.photo-card,.specie')?.querySelector('.photo-credit');try{const out=await commonsQuery(term);if(!box.isConnected)return;const photo=out[0];if(!photo)throw Error('not found');const img=document.createElement('img');img.alt=term;img.loading='lazy';img.referrerPolicy='no-referrer';img.src=photo.src;img.onerror=()=>{img.remove();if(cred)cred.querySelector('.media-status')?.replaceWith(document.createTextNode('Chưa tải được ảnh.'))};box.appendChild(img);if(cred)cred.innerHTML=mediaCredit(photo,cred.querySelector('b')?.textContent||'Ảnh thực tế')}
 catch(e){if(cred){const n=cred.querySelector('.media-status');if(n)n.textContent='Đang ngoại tuyến hoặc chưa tìm thấy ảnh';}}
 });

}

function speciesDetail(id){const x=SPECIES_CATALOG.find(y=>y.id===id);if(!x)return;openModal(`<div class="eyebrow">HỒ SƠ SINH VẬT · ${x.kind==='plant'?'THỰC VẬT':'ĐỘNG VẬT'}</div><h2>${x.emoji} ${esc(x.name)}</h2><p><i>${esc(x.latin)}</i></p><div style="max-width:540px;margin:auto">${mediaCard('Ảnh thực tế: '+x.name,x.photo,x.emoji)}</div><div class="grid c2" style="margin-top:15px"><div><p><b>🗺️ Châu lục:</b> ${esc(x.continent)}</p><p><b>🏡 Môi trường sống:</b> ${esc(x.habitat)}</p></div><div><p><b>${x.kind==='plant'?'☀️ Năng lượng':'🍽️ Thức ăn'}:</b> ${esc(x.food)}</p><p><b>✨ Đặc điểm:</b> ${esc(x.trait)}</p></div></div><p class="note">Hồ sơ là thông tin nhập môn. Ảnh được tìm trong kho Wikimedia Commons khi có mạng; có liên kết xem tác giả và giấy phép.</p><div class="cosmos-action"></div>`);hydrateMedia(document.getElementById('overlay'))}

const NASA_PLANETS=[
 {au:.3871,e:.2056,period:.24085,d:4879,shade:'#a59b91'},
 {au:.7233,e:.0068,period:.6152,d:12104,shade:'#e5bc83'},
 {au:1,e:.0167,period:1,d:12742,shade:'#2989d2'},
 {au:1.5237,e:.0934,period:1.8808,d:6779,shade:'#c76845'},
 {au:5.2028,e:.0484,period:11.862,d:139820,shade:'#d7aa80'},
 {au:9.5388,e:.0542,period:29.457,d:116460,shade:'#cbb994'},
 {au:19.1914,e:.0472,period:84.02,d:50724,shade:'#84d1db'},
 {au:30.0611,e:.0086,period:164.79,d:49244,shade:'#3f72cb'}
];
let orbitMode='learn',astroMultiplier=1,astronomyYears=0,astroInterval=null,astroActiveTime=0;
function astroRadius(i){let au=NASA_PLANETS[i].au;return orbitMode==='true'?194*au/30.0611:43+i*22;}
function astroLocation(i){let p=NASA_PLANETS[i],semi=astroRadius(i),ecc=p.e,b=semi*Math.sqrt(1-ecc*ecc);
 // Kepler's equation, M=E-e sin(E): physics-based angular orbital speed.
 let M=(astronomyYears/p.period*2*Math.PI+i*.9)%(Math.PI*2);let E=M;for(let k=0;k<5;k++)E-=(E-ecc*Math.sin(E)-M)/(1-ecc*Math.cos(E));
 return [360+semi*(Math.cos(E)-ecc),224+b*Math.sin(E)*.76];}
function solarDraw(){for(let i=0;i<8;i++){let g=document.getElementById('astroP'+i);if(!g)continue;let [x,y]=astroLocation(i);g.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)})`)}let t=document.getElementById('astroSimDate');if(t)t.textContent=`Thời gian mô phỏng: ${astronomyYears.toFixed(1)} năm tính từ mốc giả định`}
function solarBegin(){if(astroInterval)clearInterval(astroInterval);let last=performance.now();astroInterval=setInterval(()=>{if(view!=='cosmos'){clearInterval(astroInterval);astroInterval=null;return}let now=performance.now(),dt=Math.min(.08,(now-last)/1000);last=now;if(planetRunning.some(Boolean)){// time advances synchronously; stopped planet placements freeze individually
 astronomyYears+=dt*.075*astroMultiplier;for(let i=0;i<8;i++){if(!planetRunning[i])continue;let g=document.getElementById('astroP'+i);if(!g)continue;let [x,y]=astroLocation(i);g.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)})`);}}
 let t=document.getElementById('astroSimDate');if(t)t.textContent=`Đã tua ${astronomyYears.toFixed(1)} năm (mô phỏng)`;
 },45);solarDraw()}
function astronomyOrbitPath(i){let a=astroRadius(i),e=NASA_PLANETS[i].e,b=a*Math.sqrt(1-e*e)*.76,cx=360-a*e,cy=224;return `<ellipse class="astro-orbit ${i===activePlanet?'current':''}" cx="${cx}" cy="${cy}" rx="${a}" ry="${b}" />`}

function normPlace(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/(tinh|province|thanh pho|city)/g,'').replace(/[^a-z]/g,'')}
function regionForName(n){const key=normPlace(n);for(const [id,str] of Object.entries(ADMIN_GROUPS)){if(str.split('|').some(x=>{let k=normPlace(x);return key===k||key.endsWith(k)}))return id}return null}
function geoPath(poly){let multi=poly.type==='Polygon'?[poly.coordinates]:(poly.type==='MultiPolygon'?poly.coordinates:[]);let out=[];for(const parts of multi)for(const ring of parts){if(ring.length<3)continue;out.push(ring.map(([lon,lat],i)=>`${i?'L':'M'}${(30+(lon-102)*36).toFixed(1)} ${(22+(24-lat)*31.5).toFixed(1)}`).join('')+'Z')}return out.join('')}

 }catch(e){const status=document.getElementById('regionStatus');if(status&&view==='vietnam')status.textContent='Chế độ ngoại tuyến: viền vùng đang được phác họa; bản đồ tỉnh chi tiết cần kết nối Internet.'}

function atlas(){const modes=[['continent','🌏 Châu lục'],['country','🏳️ Quốc gia'],['region','🇻🇳 Vùng Việt Nam'],['biome','🌿 Sinh cảnh']];const list=v4AtlasList();if(!list.some(x=>x.id===atlasChoice)){atlasChoice=list[0]?.id||''}return `${v4FolderBack()}<div class="eyebrow">THƯ MỤC ATLAT</div><h1>🧭 Atlat địa lí & thiên nhiên</h1><p class="lede">Mở theo châu lục, quốc gia, sáu vùng Việt Nam hoặc sinh cảnh; riêng mục châu lục đã có thêm trang Atlat minh hoạ tích hợp sẵn và có thể xem lớn hoặc in trực tiếp.</p><div class="explorer-panel explorer-grid"><div><nav class="explorer-menu">${modes.map(x=>`<button class="${atlasMode===x[0]?'selected':''}" data-atlas-mode="${x[0]}">${x[1]}</button>`).join('')}</nav>${atlasMode==='country'?`<input class="search" id="atlasSearch" value="${esc(atlasSearch)}" placeholder="Tìm quốc gia..." style="width:100%;margin:14px 0">`:''}<p class="tiny-source" style="margin:12px 0 5px">Chọn thư mục con (${list.length})</p><div class="explorer-list" style="grid-template-columns:1fr;max-height:460px">${list.slice(0,185).map(x=>`<button class="${atlasChoice===x.id?'selected':''}" data-atlas-choice="${esc(x.id)}">${esc(x.label)}</button>`).join('')}</div></div><div id="atlasDetail">${v4AtlasContent()}</div></div><div class="info-ribbon" style="margin-top:16px">Atlat giải thích đặc điểm tiêu biểu; loài được nêu có thể không phân bố tại mọi điểm trong vùng. Tra cứu phân bố thực tế bằng GBIF và iNaturalist.</div>`}

function biomes(){let base=BIOMES.find(x=>x.id===selectedBiome)||BIOMES[0];return v4FolderBack()+heading(4,'Khí hậu & sinh cảnh','Chọn một sinh cảnh để mở trang riêng, có ảnh thực tế và thông tin những loài điển hình.')+`<div class="explorer-panel explorer-grid"><nav class="explorer-menu">${BIOMES.map(x=>`<button class="${selectedBiome===x.id?'selected':''}" data-v4biome="${x.id}">${x.emoji} ${x.name}</button>`).join('')}</nav><div class="explorer-detail"><h2>${base.emoji} ${base.name}</h2><div class="atlas-fact">🌦️ <b>Khí hậu:</b> ${base.temp}</div><div class="atlas-fact">🌍 <b>Phân bố:</b> ${base.where}</div><div class="atlas-fact">🌿 <b>Thực vật:</b> ${base.plants}</div><div class="atlas-fact">🐾 <b>Động vật:</b> ${base.animals}</div><p>${base.why}</p><h3>📷 Hình ảnh thiên nhiên nguồn mở</h3><div class="photo-grid">${[[base.name,base.name+' landscape',base.emoji],['Sinh vật đặc trưng',base.animals.split(',')[0]+' wildlife',base.animal],['Thực vật đặc trưng',base.plants.split(',')[0]+' plant','🌱']].map(x=>mediaCard(...x)).join('')}</div><button class="btn secondary small" style="margin-top:12px" data-nav="atlas">🧭 Xem trong Atlat</button></div></div>`}
function v4Picture(s){if(s.photo && /^(cc0|cc-by|cc-by-sa|pd)$/i.test(s.license||''))return `<img class="species-thumb" loading="lazy" src="${esc(s.photo)}" alt="${esc(s.name)}" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'species-thumb',textContent:'🐾'}))">`;return `<span class="species-thumb">${s.kind==='plant'?'🌱':'🐾'}</span>`}
function v4AllSpecies(){let a=[];for(const item of SPECIES_CATALOG){a.push({id:'local-'+item.id,name:item.name,latin:item.latin||item.name,kind:item.kind==='plant'?'plant':'animal',habitat:item.habitat,trait:item.trait,photo:'',license:'',credit:'',emoji:item.emoji,source:'Hồ sơ mẫu biên soạn'})}const seen=new Set(a.map(x=>x.latin.toLowerCase()));for(const kind of ['animal','plant'])for(const s of v4Catalog[kind]){if(seen.has(s.latin.toLowerCase()))continue;seen.add(s.latin.toLowerCase());a.push(s)}return a}
function v4Filtered(){let q=v4Query.toLocaleLowerCase('vi').trim();return v4AllSpecies().filter(s=>(v4Kind==='all'||s.kind===v4Kind)&&(!q||[s.name,s.latin,s.habitat||'',s.trait||''].join(' ').toLocaleLowerCase('vi').includes(q)))}
function v4SpeciesResults(){const all=v4Filtered(),pages=Math.max(1,Math.ceil(all.length/20));v4Page=Math.min(v4Page,pages-1);const items=all.slice(v4Page*20,(v4Page+1)*20);return `<div class="taxa-status" id="taxaStatus">Có <b>${v4Catalog.animal.length.toLocaleString('vi')} loài động vật</b> và <b>${v4Catalog.plant.length.toLocaleString('vi')} loài thực vật</b> từ iNaturalist, cộng với ${SPECIES_CATALOG.length} hồ sơ mẫu. ${esc(v4LoadMessage)}</div><p style="color:#59758d;font-size:13px">${all.length} hồ sơ phù hợp · Trang ${v4Page+1}/${pages}. Tên khoa học là chìa khóa tra cứu; tên thông dụng theo nguồn có thể chưa có bản dịch tiếng Việt.</p><div class="species-results">${items.map(s=>`<button class="species-tile" data-v4-spec="${esc(s.id)}">${v4Picture(s)}<strong>${esc(s.name)}</strong><small><i>${esc(s.latin)}</i> · ${s.kind==='plant'?'Thực vật':'Động vật'}</small></button>`).join('')||'<div>Không tìm thấy tên phù hợp.</div>'}</div><div class="astro-controls"><button class="btn secondary small" data-v4-page="prev" ${v4Page<1?'disabled':''}>← Trang trước</button><span class="top-tag">${v4Page+1} / ${pages}</span><button class="btn secondary small" data-v4-page="next" ${v4Page>=pages-1?'disabled':''}>Trang sau →</button></div>`}
function species(){return `${v4FolderBack()}<div class="eyebrow">THƯ MỤC TỰ NHIÊN</div><h1>🦋 Thư viện động vật & thực vật</h1><p class="lede">Mục tiêu nạp <b>1.000 loài động vật + 1.000 loài thực vật</b> có ghi nhận thực tế. Dữ liệu từ iNaturalist được lưu vào trình duyệt để tìm lại; mỗi tên có liên kết tra cứu tiếng Việt, GBIF và các nguồn sinh học.</p><div class="explorer-panel"><div class="astro-controls"><button id="v4LoadTaxa" class="btn" ${v4Loading?'disabled':''}>${v4Loading?'⏳ Đang nạp...':'⬇️ Nạp danh mục 2.000 loài'}</button><span class="tiny-source">Cần Internet trong lần nạp đầu · Không có âm thanh</span></div><div class="species-toolbar"><select id="v4Kind"><option value="all" ${v4Kind==='all'?'selected':''}>Tất cả sinh vật</option><option value="animal" ${v4Kind==='animal'?'selected':''}>🐾 Động vật</option><option value="plant" ${v4Kind==='plant'?'selected':''}>🌱 Thực vật</option></select><input id="v4Query" value="${esc(v4Query)}" placeholder="Tìm tên tiếng Việt / khoa học..." aria-label="Tìm sinh vật"><button class="btn secondary small" data-v4-clear="1">Xóa tìm kiếm</button></div><div id="v4SpeciesResults">${v4SpeciesResults()}</div></div><div class="atlas-fact">🔍 <b>Nguồn đối chiếu:</b> Catalogue of Life (hệ thống phân loại); GBIF (phân bố quan sát); Encyclopedia of Life (hồ sơ loài); iNaturalist (hình ảnh và ghi nhận từ cộng đồng). Mỗi ảnh có thể có điều kiện sử dụng khác nhau — chỉ hiện ảnh có giấy phép cho phép sử dụng kèm ghi nguồn.</div>`}
function v4SpeciesDetail(id){const s=v4AllSpecies().find(x=>x.id===id);if(!s)return;const q=encodeURIComponent(s.latin||s.name),wiki='https://vi.wikipedia.org/w/index.php?search='+q;let pic=s.photo&&/^(cc0|cc-by|cc-by-sa|pd)$/i.test(s.license||'')?`<img src="${esc(s.photo)}" style="max-width:100%;max-height:300px;border-radius:15px;object-fit:contain" alt="${esc(s.name)}"><div class="picture-license">Ảnh: ${esc(s.credit||'iNaturalist')} · Giấy phép: ${esc(s.license)}</div>`:mediaCard('Ảnh nguồn mở '+s.name,s.latin,s.kind==='plant'?'🌱':'🐾');openModal(`<div class="eyebrow">HỒ SƠ ${s.kind==='plant'?'THỰC VẬT':'ĐỘNG VẬT'}</div><h2>${esc(s.name)}</h2><p><i>${esc(s.latin)}</i></p><div style="max-width:550px;margin:auto">${pic}</div><p style="margin-top:13px">${s.habitat?'<b>Môi trường sống:</b> '+esc(s.habitat):'Đây là tên loài từ danh mục quan sát thực tế. Phân bố và tình trạng phân loại cần được đối chiếu qua các cơ sở dữ liệu chuyên môn.'}</p>${s.trait?`<p><b>Đặc điểm:</b> ${esc(s.trait)}</p>`:''}<div class="astro-controls"><a class="btn small" href="${wiki}" target="_blank" rel="noopener noreferrer">🇻🇳 Tra cứu tiếng Việt</a><a class="btn secondary small" href="https://www.gbif.org/species/search?q=${q}" target="_blank" rel="noopener noreferrer">🌍 GBIF</a>${String(s.id).startsWith('inat-')?`<a class="btn secondary small" href="https://www.inaturalist.org/taxa/${String(s.id).replace('inat-','')}" target="_blank" rel="noopener noreferrer">🌱 iNaturalist</a>`:''}<a class="btn secondary small" href="https://eol.org/search?q=${q}" target="_blank" rel="noopener noreferrer">📖 EOL</a></div><p class="tiny-source">Nguồn dữ liệu: ${esc(s.source||'iNaturalist')} · Tên và ảnh có thể được cập nhật bởi nguồn bên ngoài.</p>`);hydrateMedia(document.getElementById('overlay'))}
function v4NormalizeTaxon(row,kind){const t=row?.taxon||row;const latin=String(t?.name||'').trim();if(t?.rank!=='species'||!/^\S+\s+\S+$/.test(latin))return null;const photo=t.default_photo||{};const license=String(photo.license_code||'').toLowerCase();const permitted=/^(cc0|cc-by|cc-by-sa|pd)$/.test(license);return {id:'inat-'+t.id,kind,latin,name:t.preferred_common_name||latin,photo:permitted?(photo.medium_url||photo.url||''):'',credit:permitted?String(photo.attribution||'iNaturalist'):'',license:permitted?license:'',source:'iNaturalist · bảng các loài được ghi nhận',habitat:'',trait:''}}
async function v4FetchCatalog(){if(v4Loading)return;v4Loading=true;v4LoadMessage='Đang liên hệ iNaturalist...';render();let any=false;try{for(const [kind,taxonId] of [['animal',1],['plant',47126]]){const seen=new Set(v4Catalog[kind].map(s=>s.latin.toLowerCase()));for(let page=1;page<=10&&v4Catalog[kind].length<1000;page++){let ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),18000),raw;try{const url=`https://api.inaturalist.org/v1/observations/species_counts?taxon_id=${taxonId}&per_page=200&page=${page}&locale=vi&quality_grade=research`;const res=await fetch(url,{signal:ctl.signal,mode:'cors'});if(!res.ok)throw Error('Máy chủ phản hồi '+res.status);raw=await res.json()}finally{clearTimeout(timeout)}const rows=raw?.results||[];if(!rows.length)break;for(const row of rows){const s=v4NormalizeTaxon(row,kind);if(!s||seen.has(s.latin.toLowerCase()))continue;seen.add(s.latin.toLowerCase());v4Catalog[kind].push(s);any=true;if(v4Catalog[kind].length>=1000)break}v4LoadMessage=`Đã nạp ${v4Catalog.animal.length} loài động vật và ${v4Catalog.plant.length} loài thực vật...`;const status=document.getElementById('taxaStatus');if(status)status.textContent=v4LoadMessage;try{localStorage.setItem('geographyV4taxa',JSON.stringify(v4Catalog))}catch(e){}if(rows.length<200)break;await new Promise(ok=>setTimeout(ok,1050))}}
 v4LoadMessage=`Đã lưu ${v4Catalog.animal.length} loài động vật, ${v4Catalog.plant.length} loài thực vật; danh mục có thể tra cứu ngay. ${v4Catalog.animal.length<1000||v4Catalog.plant.length<1000?'Chưa đủ chỉ tiêu 1.000 loài cho mỗi nhóm; thử nạp thêm khi có mạng.':''}`;
 }catch(e){v4LoadMessage=`Không tải được dữ liệu ngoài (${String(e.message||e).slice(0,100)}). ${any?'Đã giữ lại các loài nạp được.':'Có thể xem bộ hồ sơ mẫu và thử lại khi có Internet.'}`}finally{v4Loading=false;try{localStorage.setItem('geographyV4taxa',JSON.stringify(v4Catalog))}catch(e){}if(view==='species')render()}}
function v4IslandMarks(){const arr=[['Hoàng Sa',112.0,16.5,0],['Trường Sa',114.1,9.7,0],['Phú Quốc',104.02,10.22,1],['Cát Bà',107.06,20.72,1],['Bạch Long Vĩ',107.73,20.13,1],['Lý Sơn',109.11,15.38,1],['Côn Đảo',106.6,8.68,1],['Phú Quý',108.92,10.52,1],['Cồn Cỏ',107.34,17.16,1]];return `<g>${arr.map(([name,lon,lat,small])=>{let x=45+(lon-102)*29,y=33+(24-lat)*29;return `<g class="vn-marker"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${small?3.5:5}" fill="#eea446" stroke="#16709a" stroke-width="1.4"/><title>${name}</title>${!small?`<text x="${(x-8).toFixed(1)}" y="${(y-11).toFixed(1)}" fill="#134d72" font-size="14">${name}</text>`:''}</g>`}).join('')}</g>`}
function regionMap(){const selected=VIET_REGIONS.find(r=>r.id===selectedRegion)||VIET_REGIONS[0];const fill=REGION_PALETTE[selected.id];let mapPaths;if(liveVnGeo?.length){mapPaths=VIET_REGIONS.map(r=>`<g role="button" class="region-geo ${r.id===selectedRegion?'selected':''}" data-region="${r.id}" style="opacity:${r.id===selectedRegion?1:0}" fill="${REGION_PALETTE[r.id]}">${liveVnGeo.filter(f=>f.id===r.id).map(f=>`<path d="${f.path}" stroke="#1b708b" stroke-width=".85"/>`).join('')}</g>`).join('')}else{mapPaths=`<path d="${VN_LAND_FALLBACK}" fill="#84c7a2" stroke="#20697d" stroke-width="2.1"/><circle class="v4-region-highlight" cx="${45+(selected.loc[0]-102)*29}" cy="${33+(24-selected.loc[1])*29}" r="16" fill="${fill}" stroke="#fff" stroke-width="2"/>`}
 return `<div class="v4-vn-map"><svg viewBox="0 0 570 610" role="img" id="v3RegionMap" aria-label="Bản đồ Việt Nam, vùng địa lí đang được chọn và biển đảo"><rect width="570" height="610" fill="#d6f2ff"/><g>${mapPaths}</g>${v4IslandMarks()}<text x="330" y="64" fill="#267da0" font-size="16">BIỂN ĐÔNG</text><text x="18" y="593" fill="#1b6484" font-size="11">Bản đồ không dùng để đo đạc; xem tên đảo ở mục bên dưới</text></svg><div class="v4-vn-status" id="regionStatus">${liveVnGeo?'Đường vùng kết từ địa giới tỉnh geoBoundaries ADM1 2008. Thay đổi hành chính sau năm 2008 chưa được thể hiện.':'Đường bờ đất liền từ Natural Earth. Để xem ranh giới sáu vùng theo địa giới tỉnh cần kết nối mạng; vòng sáng chỉ vị trí vùng được chọn.'}</div></div>`}
// geoBoundaries 2008 geographic geometry; its province group limits reflect this historical source, not 2026 administration.
function geoPath(poly){const multi=poly.type==='Polygon'?[poly.coordinates]:(poly.type==='MultiPolygon'?poly.coordinates:[]);let out=[];for(const parts of multi)for(const ring of parts){if(ring.length<3)continue;out.push(ring.map(([lon,lat],i)=>`${i?'L':'M'}${(45+(lon-102)*29).toFixed(1)},${(33+(24-lat)*29).toFixed(1)}`).join('')+'Z')}return out.join('')}
function updateRealVNMap(){if(!liveVnGeo||view!=='vietnam')return;const el=document.querySelector('.v4-vn-map');if(el)el.outerHTML=regionMap()}
function islandMarkers(){return v4IslandMarks()}
function regionPanel(){const r=VIET_REGIONS.find(x=>x.id===selectedRegion)||VIET_REGIONS[0],a=VN_EXTRAS[r.id];return `<div class="eyebrow">KHU VỰC ĐANG MỞ</div><h2>${r.emoji} ${r.title}</h2><div class="atlas-fact"><b>🌦️ Khí hậu:</b> ${r.weather}</div><div class="atlas-fact"><b>⛰️ Địa hình:</b> ${r.land}</div><div class="atlas-fact"><b>🌱 Cây cối:</b> ${r.plants}</div><div class="atlas-fact"><b>🐾 Động vật:</b> ${r.animals}</div><div class="atlas-fact">${r.facts}</div><h3>📷 Ảnh thật tiêu biểu</h3><div class="photo-grid">${a[2].map(x=>mediaCard(...x)).join('')}</div>`}
function vietnam(){return `${v4FolderBack()}<div class="eyebrow">THƯ MỤC ĐỊA LÍ VIỆT NAM</div><h1>🇻🇳 Việt Nam – sáu vùng và biển đảo</h1><p class="lede">Chọn vùng để chỉ hiển thị màu của vùng ấy trên bản đồ, xem khí hậu, địa hình, cây cối và động vật ngay bên cạnh. Các đảo và quần đảo có tên riêng trên bản đồ.</p><div class="explorer-panel explorer-grid"><div><h3>📁 Sáu vùng Việt Nam</h3><nav class="explorer-menu">${VIET_REGIONS.map(r=>`<button class="${selectedRegion===r.id?'selected':''}" data-region="${r.id}">${r.emoji} ${r.title}</button>`).join('')}</nav><div class="island-legends" style="grid-template-columns:1fr"><span>🏝️ Phú Quốc · Cát Bà · Côn Đảo</span><span>🏝️ Hoàng Sa · Trường Sa</span><span>🏝️ Bạch Long Vĩ · Lý Sơn · Phú Quý · Cồn Cỏ</span></div></div><div><div class="atlas-hero" style="grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)"><div>${regionMap()}</div><div id="regionPanel">${regionPanel()}</div></div></div></div><p class="tiny-source" style="margin-top:12px">Nguồn nền bản đồ: Natural Earth; chi tiết địa giới cũ: geoBoundaries ADM1 (năm dữ liệu 2008). Số hóa hiện có chưa phải bản đồ hành chính 34 tỉnh/thành năm 2026.</p>`}
function world(){return v4FolderBack()+worldV2()+`<div class="island-legends"><span>🏝️ Hoàng Sa</span><span>🏝️ Trường Sa</span><span>🏝️ Phú Quốc</span></div><button class="btn secondary small" data-nav="vietnam">🇻🇳 Xem bản đồ Việt Nam và biển đảo</button>`}
function v4GenerateQuiz(){const more=[],conts=['Asia','Europe','Africa','North America','South America','Oceania'];const labels=Object.fromEntries(CONTINENTS.map(x=>[x[0],x[1]]));for(let i=0;i<8;i++){const ans=PLANETS[i][0];let others=PLANETS.map(p=>p[0]).filter(x=>x!==ans),opts=[ans,...others.slice((i*3)%7).concat(others).slice(0,3)],ix=(i*7)%4;opts=[...opts.slice(1,ix+1),ans,...opts.slice(ix+1)];if(opts.length!==4||new Set(opts).size!==4)continue;more.push(['cosmos',`Hành tinh thứ ${i+1} tính từ Mặt Trời là hành tinh nào?`,opts,opts.indexOf(ans),`${ans} là hành tinh đứng vị trí thứ ${i+1}.`])}
 const accessibleCountries=new Set([...Object.keys(FEATURED),'France','Italy','Germany','Brazil','United States of America','Canada','Australia','Egypt','Kenya','Thailand','Cambodia','Laos','Japan','Nepal','Sweden','Norway','Spain','Portugal','Greece','Mexico','South Africa','Argentina','Peru','Chile','New Zealand','Malaysia','Singapore','Philippines','Indonesia','United Kingdom']);for(const c of COUNTRY_DATA){if(!accessibleCountries.has(c.name)||!conts.includes(c.continent)||['Russia','Kazakhstan','Turkey','Cyprus','Georgia','Azerbaijan','Armenia','Indonesia','Papua New Guinea','Falkland Is.','Kosovo','W. Sahara'].includes(c.name))continue;let ans=labels[c.continent],wrong=conts.filter(x=>x!==c.continent).slice(0,3).map(x=>labels[x]);let ops=wrong.slice();ops.splice(c.name.length%4,0,ans);more.push(['world',`Quốc gia/lãnh thổ ${NAME_VI[c.name]||c.name} được xếp ở châu lục nào?`,ops,ops.indexOf(ans),'Theo bản đồ, nơi này nằm ở '+ans+'.'])}
 for(const b of BIOMES){let opts=BIOMES.filter(x=>x.id!==b.id).slice(0,3).map(x=>x.name),a=b.name;opts.splice(b.id.length%4,0,a);more.push(['biomes',`Sinh cảnh nào có đặc điểm: ${b.temp.toLocaleLowerCase('vi')}?`,opts,opts.indexOf(a),b.name+' thường có khí hậu: '+b.temp+'.'])}
 const full=[...QUESTIONS,...more];const unique=new Map();for(const q of full){if(!unique.has(q[1])&&q[2].length===4&&q[3]>=0)unique.set(q[1],q)}return [...unique.values()]}
const V4_QUIZ=v4GenerateQuiz();
function newQuiz(count=10){let all=shuffle([...V4_QUIZ]);const keys=['cosmos','earth','nature','biomes','world','vietnam','species'];let selected=[];for(let n=0;n<keys.length;n++){const options=all.filter(q=>q[0]===keys[n]);selected.push(...options.slice(0,Math.min(2,Math.floor(count/keys.length)+1)))}selected=[...new Map(selected.map(q=>[q[1],q])).values()];for(const q of all){if(selected.length>=count)break;if(!selected.some(x=>x[1]===q[1]))selected.push(q)}selected=shuffle(selected.slice(0,count));quiz={items:selected,idx:0,choice:null,score:0,finished:false,added:false,total:selected.length};render()}
function quizPage(){if(!quiz){return `${v4FolderBack()}<div class="eyebrow">KIỂM TRA ĐỊA LÍ · DỄ → VỪA</div><h1>🏆 Thử thách nhà thám hiểm</h1><p class="lede">Ngân hàng ${V4_QUIZ.length} câu, phân bổ nhiều chủ đề. <b>Không có câu hỏi trùng nhau trong cùng một bài kiểm tra.</b> Chọn số câu rồi bắt đầu.</p><div class="grid c3">${[10,20,30].map(n=>`<button class="journey" data-newquiz="${n}"><div class="bigemoji">${n===10?'🌟':n===20?'🏅':'🏆'}</div><h3>${n} câu</h3><p>Độ khó từ dễ đến vừa · không lặp câu</p><span class="stage">BẮT ĐẦU →</span></button>`).join('')}</div>`}return v4FolderBack()+quizPageOriginal()}

/* V5: full-screen folder controls, Vietnamese knowledge retrieval, PNG snapshot and print */
NAV.push(['search','🔎','Tìm kiếm kiến thức']);
let knowledgeQuery='',knowledgeCategory='Tất cả',knowledgePage=0,knowledgeResults=[];
const KNOWLEDGE_PAGE_SIZE=10;
function normalizeVI(s){return String(s??'').toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim()}
function mkHit(type,title,description,target,extra={},keywords=''){
 return {type,title:String(title),description:String(description||''),target,...extra,keywords:String(keywords||'')};
}
function knowledgeIndex(){
 const list=[];
 for(const n of NAV)if(!['home','search'].includes(n[0]))list.push(mkHit('Bài học',n[2],{
 cosmos:'Tám hành tinh, chuyển động theo quỹ đạo, khoảng cách và vận tốc thiên văn.',earth:'Địa cầu, các lớp Trái Đất, kinh tuyến, vĩ tuyến và năm đại dương.',nature:'Ngày đêm, các mùa, vòng tuần hoàn nước, gió, thủy triều, mảng kiến tạo và pha Mặt Trăng.',biomes:'Đặc điểm khí hậu, sinh cảnh, động vật và thực vật ở các môi trường sống.',world:'Bản đồ các châu lục, quốc gia, lãnh thổ và biển đảo.',vietnam:'Bản đồ Việt Nam, các vùng địa lí, khí hậu và hệ sinh thái.',species:'Kho động thực vật: tên tiếng Việt, tên khoa học và môi trường sống.',atlas:'Atlat theo châu lục, quốc gia, vùng Việt Nam và sinh cảnh.',quiz:'Câu hỏi trắc nghiệm địa lí dễ đến vừa.',dictionary:'Giải nghĩa thuật ngữ địa lí bằng tiếng Việt.'
 }[n[0]]||'Khám phá kiến thức địa lí.',n[0]));
 PLANETS.forEach((p,i)=>list.push(mkHit('Hành tinh',p[0],p[2],'cosmos',{planet:i},'Hệ Mặt Trời vũ trụ quỹ đạo')));
 Object.entries(GEO_INFO).forEach(([id,x])=>list.push(mkHit('Bản đồ',x[0],x[1],'earth',{geo:id},'Trái Đất kinh độ vĩ độ xích đạo đại dương bản đồ')));
 SCIENCE.forEach(x=>list.push(mkHit('Hiện tượng',x.icon+' '+x.name,x.lead+' '+(x.remember||''),'nature',{science:x.id},x.steps.join(' '))));
 BIOMES.forEach(x=>list.push(mkHit('Sinh cảnh',x.emoji+' '+x.name,`Khí hậu: ${x.temp}. Thực vật: ${x.plants}. Động vật: ${x.animals}. Phân bố: ${x.where}.`,'biomes',{biome:x.id},x.why)));
 CONTINENTS.forEach(x=>{const a=ATLAS_NATURE[x[0]];list.push(mkHit('Atlat',x[2]+' '+x[1],a?`Khí hậu: ${a.climate}. Địa hình: ${a.land}. Động vật: ${a.animal}. Thực vật: ${a.plant}.`:x[3],'atlas',{atlasType:'continent',atlasId:x[0]},x[3]))});
 VIET_REGIONS.forEach(r=>list.push(mkHit('Vùng Việt Nam',r.emoji+' '+r.title,`Địa hình: ${r.land}. Khí hậu: ${r.weather}. Cây trồng: ${r.plants}. Động vật: ${r.animals}.`,'vietnam',{region:r.id},r.facts)));
 COUNTRY_DATA.forEach(c=>{const name=VN_NAMES[c.name]||c.name,t=FEATURED[c.name];const desc=t?`Khí hậu: ${t[2]}. Sinh cảnh: ${t[3]}. Sinh vật: ${t[4]}.`:'Quốc gia/lãnh thổ trên bản đồ thế giới; mở Atlat để tìm hiểu khí hậu và thiên nhiên.';list.push(mkHit('Quốc gia',name,desc,'atlas',{atlasType:'country',atlasId:c.name},c.name+' '+c.continent))});
 WORDS.forEach(w=>list.push(mkHit('Thuật ngữ',w[0],w[1],'dictionary',{word:w[0]})));
 v4AllSpecies().forEach(s=>list.push(mkHit('Sinh vật', (s.emoji|| (s.kind==='plant'?'🌱':'🐾'))+' '+s.name, [s.latin,'Môi trường sống: '+(s.habitat||'Xem dữ liệu khoa học trong hồ sơ.')].join('. '),'species',{taxon:s.id},s.trait||'')));
 return list;
}
function knowledgeMatch(){const q=normalizeVI(knowledgeQuery);if(!q){knowledgeResults=[];return []};const words=q.split(' ').filter(Boolean);
 const results=knowledgeIndex().map((h,i)=>{
 const t=normalizeVI(h.title),b=normalizeVI(h.description+' '+h.keywords),all=t+' '+b;
 if(!words.every(w=>all.includes(w)))return null;
 let score=t===q?100:t.startsWith(q)?80:t.includes(q)?60:25;
 score+=Math.min(14,words.filter(w=>t.includes(w)).length*5);if(h.type==='Sinh vật')score-=4;
 return {...h,score,origin:i};
 }).filter(Boolean).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title,'vi'));
 knowledgeResults=results;return results;
}
function knowledgeSearchPage(){const cats=['Tất cả','Bài học','Hiện tượng','Bản đồ','Hành tinh','Sinh cảnh','Atlat','Quốc gia','Vùng Việt Nam','Sinh vật','Thuật ngữ'];const results=knowledgeMatch();const filtered=knowledgeCategory==='Tất cả'?results:results.filter(x=>x.type===knowledgeCategory);const pages=Math.max(1,Math.ceil(filtered.length/KNOWLEDGE_PAGE_SIZE));knowledgePage=Math.min(knowledgePage,pages-1);
 const slice=filtered.slice(knowledgePage*KNOWLEDGE_PAGE_SIZE,(knowledgePage+1)*KNOWLEDGE_PAGE_SIZE);
 return `${v4FolderBack()}<div class="eyebrow">THƯ MỤC TRA CỨU</div><h1>🔎 Tìm kiếm kiến thức địa lí</h1><p class="lede">Nhập từ khóa tiếng Việt có dấu hoặc không dấu. Kết quả hiển thị <b>nội dung giải thích</b> và mở thẳng đến đúng bài học hay hồ sơ Atlat.</p><div class="knowledge-wrap"><form id="knowledgeForm" class="knowledge-form"><input id="knowledgeInput" class="knowledge-input" type="search" placeholder="Ví dụ: trăng, gió, kinh độ, voi, đồng bằng, sa mạc..." autocomplete="off" value="${esc(knowledgeQuery)}" aria-label="Từ khóa cần tra cứu"><button type="submit" class="btn">🔎 Tìm kiến thức</button></form><div class="knowledge-cats">${cats.map(c=>`<button class="pill ${knowledgeCategory===c?'selected':''}" data-knowledge-category="${c}">${c}</button>`).join('')}</div><div id="knowledgeHits"><div class="knowledge-count">${!knowledgeQuery.trim()?'💡 Gợi ý khám phá:':`${filtered.length} kết quả phù hợp`}</div>${!knowledgeQuery.trim()?`<div class="suggestions">${['ngày và đêm','pha Mặt Trăng','kinh tuyến','vòng tuần hoàn nước','rừng mưa','Việt Nam','báo hoa mai','Sao Thổ'].map(k=>`<button data-knowledge-suggest="${k}">${k} →</button>`).join('')}</div>`:filtered.length?`<div class="knowledge-cards">${slice.map(h=>`<article class="knowledge-card"><div class="knowledge-type">${esc(h.type)}</div><h3>${esc(h.title)}</h3><p>${esc(h.description)}</p><button class="btn secondary small" data-knowledge-open="${knowledgeResults.indexOf(h)}">📖 Mở phần kiến thức →</button></article>`).join('')}</div>${pages>1?`<div class="knowledge-pages"><button class="btn secondary small" data-knowledge-page="prev" ${knowledgePage===0?'disabled':''}>← Trang trước</button><strong>Trang ${knowledgePage+1}/${pages}</strong><button class="btn secondary small" data-knowledge-page="next" ${knowledgePage===pages-1?'disabled':''}>Trang sau →</button></div>`:''}`:'<div class="empty">Không có kết quả. Thử từ khóa ngắn hơn hoặc viết không dấu, ví dụ “mua”, “trang”, “dong vat”.</div>'}</div></div>`;
}
function knowledgeRefresh(){const node=document.getElementById('screen');if(view!=='search'||!node)return;let focused=document.activeElement?.id==='knowledgeInput';let caret=focused?document.activeElement.selectionStart:0;node.innerHTML=knowledgeSearchPage();if(focused){let inp=document.getElementById('knowledgeInput');inp.focus({preventScroll:true});try{inp.setSelectionRange(caret,caret)}catch(_){}}document.querySelector('#quickKnowledgeInput')?.setAttribute('value',knowledgeQuery)}
function knowledgeGo(hit){if(!hit)return;
 if(hit.planet!==undefined)activePlanet=hit.planet;
 if(hit.science)selectedScience=hit.science;
 if(hit.biome)selectedBiome=hit.biome;
 if(hit.geo)geoFocus=hit.geo;
 if(hit.region)selectedRegion=hit.region;
 if(hit.atlasType){atlasMode=hit.atlasType;atlasChoice=hit.atlasId;atlasSearch=''}
 if(hit.taxon){const s=v4AllSpecies().find(x=>x.id===hit.taxon);if(s){v4Query=s.name;v4Kind='all';v4Page=0}}
 if(hit.word)selectedDictionary=hit.word;
 setView(hit.target);
 if(hit.taxon){v4SpeciesDetail(hit.taxon)}
}
function showSearch(){setView('search');setTimeout(()=>document.getElementById('knowledgeInput')?.focus({preventScroll:true}),0)}
function searchResults(){ /* V4 popup search superseded by full-page searchable knowledge records. */ }
const _oldRender=renderV4;
function render(){if(view==='search'){
 clearOrbit();if(astroInterval){clearInterval(astroInterval);astroInterval=null}if(motionTimer){clearInterval(motionTimer);motionTimer=null}
 renderNav();document.getElementById('screen').innerHTML=knowledgeSearchPage();return;
 }_oldRender()}
function v5Print(){document.body.classList.add('printing');try{window.print()}finally{setTimeout(()=>document.body.classList.remove('printing'),1200)}}
function pngDownload(dataUrl){const a=document.createElement('a');a.href=dataUrl;a.download='hanh-tinh-ki-dieu-'+view+'-'+new Date().toISOString().slice(0,10)+'.png';document.body.appendChild(a);a.click();a.remove()}
async function v5Capture(){const btn=document.getElementById('captureBtn');if(btn){btn.disabled=true;btn.textContent='⌛ Đang chụp...'}
 try{
 const el=document.getElementById('screen');if(!el)throw Error('Không tìm thấy trang học');
 const w=Math.min(1800,Math.max(el.clientWidth,350)),h=Math.min(1800,Math.max(el.clientHeight,400));
 const clone=el.cloneNode(true);const div=document.createElement('div');div.setAttribute('xmlns','http://www.w3.org/1999/xhtml');div.setAttribute('style',`width:${w}px;height:${h}px;overflow:hidden;background:#f4f8fd;position:relative;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#173b58;`);
 const st=document.createElement('style');st.textContent=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n').replace(/url\([^)]*\)/gi,'none')+'\n#captureContent{display:block!important;width:'+w+'px!important;max-width:none!important;height:auto!important;max-height:none!important;overflow:visible!important;margin:0!important;transform:translateY(-'+el.scrollTop+'px)}';div.appendChild(st);
 clone.id='captureContent';clone.style.width=w+'px';clone.style.maxWidth='none';clone.style.height='auto';clone.style.minHeight=h+'px';clone.style.overflow='visible';
 // Remote images cannot safely be rasterized without the author's CORS permission. Keep their alt text and image credits.
 clone.querySelectorAll('img').forEach(im=>{if(im.src.startsWith('data:'))return;const placeholder=document.createElement('div');placeholder.style.cssText='min-height:100px;background:#e0f3fc;color:#275b7b;display:grid;place-items:center;border:1px solid #cae1f1;border-radius:9px;font-size:13px;text-align:center;padding:10px';placeholder.textContent='🖼️ '+(im.alt||'Ảnh từ nguồn mở');im.replaceWith(placeholder)});
 clone.querySelectorAll('input,textarea').forEach((x,i)=>{const original=el.querySelectorAll('input,textarea')[i];if(original){x.setAttribute('value',original.value);if(x.tagName==='TEXTAREA')x.textContent=original.value}});
 div.appendChild(clone);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject x="0" y="0" width="100%" height="100%">${new XMLSerializer().serializeToString(div)}</foreignObject></svg>`;
 const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
 try{
 const im=new Image();im.src=url;await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=()=>reject(Error('Không thể kết xuất ảnh trên trình duyệt này'));setTimeout(()=>reject(Error('Hết thời gian chụp ảnh')),9000)});
 const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const ctx=c.getContext('2d');ctx.scale(2,2);ctx.fillStyle='#f4f8fd';ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0);
 pngDownload(c.toDataURL('image/png'));
 toast('✅ Đã tạo ảnh PNG phần đang xem. Ảnh từ mạng có thể chỉ hiện tên và nguồn.');
 }finally{ /* Data URL: no URL object to revoke */ }
 }catch(e){toast('Không chụp được trên trình duyệt này. Bé có thể sử dụng chức năng chụp màn hình của thiết bị hoặc chọn In → Lưu PDF.');console.warn('capture',e)}
 finally{if(btn){btn.disabled=false;btn.textContent='📸 Lưu ảnh'}}
}
async function v5FullScreen(){try{
 if(document.fullscreenElement){await document.exitFullscreen();document.body.classList.remove('v5-immersive')}
 else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();document.body.classList.add('v5-immersive')}
 else{document.body.classList.toggle('v5-immersive');toast('Đã chuyển sang chế độ xem rộng. Một số trình duyệt trên điện thoại không hỗ trợ toàn màn hình.')}
 }catch(e){document.body.classList.toggle('v5-immersive');toast('Đang mở chế độ xem rộng. Có thể dùng nút thu nhỏ để trở lại.')}
}
document.addEventListener('click',e=>{const t=e.target.closest('#captureBtn,#printBtn,#fullscreenBtn,[data-knowledge-open],[data-knowledge-page],[data-knowledge-category],[data-knowledge-suggest],#quickSearchBtn');if(!t)return;
 if(t.id==='captureBtn')v5Capture();
 if(t.id==='printBtn')v5Print();
 if(t.id==='fullscreenBtn')v5FullScreen();
 if(t.id==='quickSearchBtn'){knowledgeQuery=(document.getElementById('quickKnowledgeInput')?.value||'').trim();knowledgePage=0;showSearch()}
 if(t.dataset.knowledgeOpen!==undefined)knowledgeGo(knowledgeResults[Number(t.dataset.knowledgeOpen)]);
 if(t.dataset.knowledgeCategory!==undefined){knowledgeCategory=t.dataset.knowledgeCategory;knowledgePage=0;knowledgeRefresh()}
 if(t.dataset.knowledgeSuggest!==undefined){knowledgeQuery=t.dataset.knowledgeSuggest;knowledgePage=0;knowledgeRefresh()}
 if(t.dataset.knowledgePage!==undefined){knowledgePage=Math.max(0,knowledgePage+(t.dataset.knowledgePage==='next'?1:-1));knowledgeRefresh()}
 },true);
document.addEventListener('submit',e=>{if(e.target.id==='knowledgeForm'||e.target.id==='quickKnowledgeForm'){
 e.preventDefault();knowledgeQuery=(document.getElementById(e.target.id==='knowledgeForm'?'knowledgeInput':'quickKnowledgeInput')?.value||'').trim();knowledgePage=0;if(view==='search')knowledgeRefresh();else showSearch();
 }},true);
document.addEventListener('input',e=>{if(e.target.id==='knowledgeInput'){knowledgeQuery=e.target.value;knowledgePage=0;knowledgeRefresh()}}
,true);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();showSearch()}},true);

const h=location.hash.substring(1);view=NAV.some(n=>n[0]===h)?h:'home';
document.addEventListener('click',e=>{const x=e.target.closest('[data-open-atlas-image],[data-print-atlas],[data-close-atlas-overlay]');if(!x)return;
 if(x.dataset.openAtlasImage){openAtlasLightbox(x.dataset.openAtlasImage,x.dataset.openAtlasTitle||'Atlat minh hoạ')}
 else if(x.dataset.printAtlas){printAtlasPoster(x.dataset.printAtlas,x.dataset.printTitle||'Atlat minh hoạ')}
 else if(x.dataset.closeAtlasOverlay){closeAtlasLightbox()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAtlasLightbox()});
render();
